# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/" # Location of package manifests
      schedule:
          interval: "weekly"
      # TypeScript is pinned manually on purpose: stay on v6, never auto-upgrade to v7.
      ignore:
          - dependency-name: "typescript"
      groups:
          all-version-updates:
              patterns:
                  - "*"
