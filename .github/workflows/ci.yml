name: CI
permissions:
    contents: read
on:
    pull_request:
    push:
        branches:
            - main
jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  # TODO: Switch to stable (or drop this pin to use package.json) once Bun ships `lint` and `fmt` in stable.
                  bun-version: canary

            - name: Setup Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: TypeCheck
              run: bun run tsc

            - name: Lint
              run: bun run lint --max-warnings=0

            - name: Format
              run: bun run prettier:check

            - name: Knip
              run: bun run knip

            - name: Run Tests
              run: bun run test

            - name: Build
              run: bun run build

            - name: Build Firefox
              run: bun run build:firefox

            - name: Bundle Size Budgets
              run: bun run verify perf bundle --check

            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright Chromium
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: bunx playwright-core install chromium --no-shell --with-deps

            - name: Install Playwright Chromium system deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: bunx playwright-core install-deps chromium

            - name: Verify MV3 Boot (Doctor)
              env:
                  TMPDIR: /tmp
              run: bun run verify doctor
