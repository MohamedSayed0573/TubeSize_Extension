name: Release
run-name: "Release ${{ inputs.bump }} (dryRun: ${{ inputs.dryRun }})"
permissions:
    contents: write
on:
    workflow_dispatch:
        inputs:
            dryRun:
                description: "Dry run: verify store credentials without submitting"
                type: boolean
                default: false
            bump:
                description: "Version bump type (major, minor, patch)"
                type: choice
                default: "patch"
                options:
                    - major
                    - minor
                    - patch

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Bump version
              id: bump
              run: |
                  pnpm version ${{ inputs.bump }} --no-git-tag-version
                  echo "version=$(node -p "JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).version")" >> $GITHUB_OUTPUT

            - name: TypeCheck
              run: pnpm run tsc

            - name: Lint
              run: pnpm run lint

            - name: Knip
              run: pnpm run knip

            - name: Run Tests
              run: pnpm run test

            - name: Commit, tag, and push version bump
              if: inputs.dryRun != true
              run: |
                  VERSION="${{ steps.bump.outputs.version }}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -am "chore(release): $VERSION"
                  git tag "extension-v$VERSION" -m "Release extension-v$VERSION"
                  git push origin "HEAD:${{ github.ref_name }}" --follow-tags

            - name: Build release packages
              run: |
                  pnpm run zip
                  pnpm run zip:firefox

            - name: Submit to stores
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_API_VERSION: ${{ secrets.CHROME_API_VERSION }}
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
                  CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
                  FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
                  EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
                  EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
                  EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
              run: |
                  ARGS=""
                  if [ "${{ inputs.dryRun }}" = "true" ]; then
                      ARGS="--dry-run"
                  fi
                  # Edge reuses the Chrome zip (same MV3 package)
                  pnpm exec wxt submit $ARGS \
                      --chrome-zip .output/*-chrome.zip \
                      --firefox-zip .output/*-firefox.zip \
                      --firefox-sources-zip .output/*-sources.zip \
                      --edge-zip .output/*-chrome.zip

            - name: Create Release
              if: inputs.dryRun != true
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: extension-v${{ steps.bump.outputs.version }}
                  files: |
                      .output/*-chrome.zip
                      .output/*-firefox.zip
                      .output/*-sources.zip
                  fail_on_unmatched_files: true
                  generate_release_notes: true
