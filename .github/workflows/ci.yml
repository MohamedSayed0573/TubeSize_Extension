name: CI
permissions:
    contents: read
on:
    pull_request:
    push:
        branches:
            - main
jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3

            - name: Setup Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: TypeCheck
              run: bun run tsc

            - name: Lint
              run: bun run lint --deny-warnings

            - name: Knip
              run: bun run knip

            - name: Run Tests
              run: bun run test

            - name: Build
              run: bun run build
