name: Release
permissions:
    contents: write
on:
    push:
        tags:
            - "extension-v*.*.*"
    workflow_dispatch:
        inputs:
            dryRun:
                description: "Dry run: verify store credentials without submitting"
                type: boolean
                default: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.2

            - name: Install pnpm
              uses: pnpm/action-setup@v5

            - name: Set up Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: TypeCheck
              run: pnpm run tsc

            - name: Lint
              run: pnpm run lint

            - name: Knip
              run: pnpm run knip

            - name: Run Tests
              run: pnpm run test

            - name: Build release packages
              run: |
                  pnpm run pack:firefox
                  pnpm run pack

            - name: Submit to stores
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
                  EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
                  EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
                  EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
              run: |
                  ARGS=""
                  if [ "${{ inputs.dryRun }}" = "true" ]; then
                      ARGS="--dry-run"
                  fi
                  # Edge reuses the Chrome zip (same MV3 package)
                  pnpm exec wxt submit $ARGS \
                      --chrome-zip .output/*-chrome.zip \
                      --firefox-zip .output/*-firefox.zip \
                      --firefox-sources-zip .output/*-sources.zip \
                      --edge-zip .output/*-chrome.zip

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      .output/tubesize-*-chrome.zip
                      .output/tubesize-*-firefox.zip
                  fail_on_unmatched_files: true
                  generate_release_notes: true
